# Веб-панель __SERVICE_PREFIX__.
# Приложение слушает только 127.0.0.1 — наружу его публикует nginx.
#
# Блок намеренно НЕ является default_server и не занимает порт 80:
# на сервере могут работать другие сайты.
server {
    listen __NGINX_PORT__;
    server_name _;

    client_max_body_size 4m;

    location / {
        proxy_pass         http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass  http://127.0.0.1:__WEB_PORT__/healthz;
        access_log  off;
    }
}
